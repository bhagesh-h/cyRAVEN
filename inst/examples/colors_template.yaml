# =============================================================================
# colors: block template for --config
# =============================================================================
# Every colour every figure draws with, in one place. This block is entirely
# OPTIONAL: any key you omit keeps its built-in default (see
# ?cyRAVEN::default_colors). Paste this whole file under a `colors:` key in your
# own --config YAML, delete the keys you don't want to change, and edit the
# rest. Values below are the package's actual built-in defaults, so pasting
# this in unedited changes nothing.
#
# Values are either a hex colour ("#RRGGBB"), an R colour name ("white",
# "grey20", "firebrick", ...), or, for population_palette, a list of them.
# viridis option keys (density_viridis, intensity_viridis, count_viridis)
# take one of viridisLite's option letters/names: "A"/"magma", "B"/"inferno",
# "C"/"plasma", "D"/"viridis", "E"/"cividis", "F"/"rocket", "G"/"mako",
# "H"/"turbo".

colors:
  # Discrete: populations, samples, groups. Extra colours beyond this list's
  # length are filled in from hcl.colors() automatically, you don't need to
  # extend this list just because a panel has more populations than colours
  # here.
  population_palette:
    - "#E8112D"
    - "#FF7A00"
    - "#FFC800"
    - "#8FD400"
    - "#00B34A"
    - "#00C2D1"
    - "#0072F0"
    - "#FF3D9E"
    - "#00E0A0"

  # "Other CD45+" catch-all, kept out of population_palette on purpose (see
  # population_colours() in the script) so a real population can never be
  # issued it.
  # Study/cohort curves and bars: --reference-group is ALWAYS the first entry
  # (green), then the remaining studies in sorted order. Fixed on purpose so a
  # colour means the same study in every figure.
  study_palette:
    - "#00A651"   # reference / healthy control
    - "#E8112D"   # study 1
    - "#8E44E8"   # study 2

  # Sex, fixed everywhere it is drawn.
  sex_palette:
    male: "#00A651"
    female: "#E8112D"

  other_grey: "#7A5C00"

  reference_fill: "white"    # unfilled bar for the group_comparison reference group
  na_fill: "grey85"          # tile with no value (absolute_counts_qc.png)

  # Gating diagnostics (recon_diagnostics.png): leukocyte gate box outline and
  # the CD45 threshold's dashed line.
  gate_highlight: "#D62728"

  # Threshold review flag (gating_qc.png): a valley-derived cut vs. one that
  # needed a fallback and should be checked.
  threshold_ok: "grey20"
  threshold_review: "firebrick"

  # Structural chrome: bar/tile outlines, error bars, significance brackets.
  bar_outline: "grey20"
  bracket: "black"
  tile_border: "white"

  # Theme text and gridlines, and figure-level caption/subtitle text.
  grid_major: "grey90"
  axis_ticks: "grey30"
  subtitle_text: "grey35"
  caption_text: "grey30"
  label_text: "grey25"
  empty_panel_text: "grey40"

  # Continuous (viridis) scales.
  density_viridis: "mako"      # hexbin/density figures: recon scatter, UMAP density
  intensity_viridis: "magma"   # marker-intensity / covariate continuous UMAP colouring
  count_viridis: "D"           # absolute_counts_qc.png heatmap
