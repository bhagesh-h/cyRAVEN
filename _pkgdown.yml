url: https://bhagesh-h.github.io/cyRAVEN

template:
  bootstrap: 5
  light-switch: true

reference:
- title: Run the pipeline
  desc: >
    One call does everything. The stage functions below are the same code, split
    so a step can be run, inspected or replaced on its own.
  contents:
  - run_cyraven

- title: Reading and transformation
  desc: >
    Getting FCS files into a matrix on a sensible scale. The transform is
    selectable, and its parameters are derived once per panel so every sample
    stays on one ruler.
  contents:
  - read_fcs_resolved
  - fingerprint_panels
  - maybe_compensate
  - make_transform
  - derive_cofactor
  - derive_cofactor_pooled
  - derive_logicle_pooled

- title: Gating
  desc: >
    Thresholds derived from each sample's own density rather than transferred
    from fixed coordinates. The reference for a marker that resolves no minimum
    can be an unstained tube or a fluorescence-minus-one control, and a single
    sample's cut can be corrected by hand with the correction recorded.
  contents:
  - density_valley
  - resolve_threshold
  - apply_gate_hierarchy
  - staining_verdict
  - sample_override
  - parse_fmo_map
  - fmo_for_sample
  - fmo_agreement

- title: Acquisition and panel quality
  desc: >
    Two questions the gating stage cannot answer on its own: whether the
    instrument was doing the same thing throughout the acquisition, and whether a
    marker that resolves no density minimum is failing because of the panel.
  contents:
  - find_time_column
  - detect_time_anomalies
  - run_acquisition_qc
  - frequency_delta_if_cleaned
  - fig_acquisition_qc
  - spreading_pairs
  - run_spreading_report

- title: Calibration
  desc: >
    Channel units are comparable within an instrument and never between two.
    Beads of assigned fluorophore equivalence convert them to units that are.
  contents:
  - bead_peaks
  - fit_bead_calibration
  - apply_bead_calibration

- title: Uncertainty
  desc: >
    How far a threshold can move, how many cells were behind the frequency it
    produced, and what each of those costs. Every cut is resampled and re-derived
    over the settings that placed it, and the resulting spread is propagated to
    the populations that read it; the counting term is reported beside it,
    because a well-placed cut and a sufficient number of events are different
    guarantees. None of this changes a reported number; it puts a second number
    next to it.
  contents:
  - threshold_uncertainty
  - counting_uncertainty
  - population_frequency_uncertainty
  - run_gate_uncertainty
  - annotate_gate_uncertainty
  - valley_setting_grid

- title: Populations
  desc: Scoring a declarative population specification.
  contents:
  - score_populations
  - default_population_spec
  - default_functional_blocks
  - expected_positive_markers
  - compute_population_ratios

- title: Embedding
  desc: One shared UMAP per marker panel, plus model persistence for later batches.
  contents:
  - select_umap_features
  - plan_subsample
  - density_weights
  - draw_subsample_rare
  - run_umap
  - save_umap_model
  - load_umap_model
  - project_umap

- title: Clustering
  desc: >
    Unsupervised clustering as a cross-check on the gate specification, and
    reference-defined subclustering.
  contents:
  - run_unsupervised_clusters
  - cluster_gate_agreement
  - subcluster_by_reference
  - choose_subcluster_k

- title: Learned gates
  desc: >
    The inverse of the gating stage: given a set of labelled cells, learn a
    two-marker gating strategy that selects them. This is what turns "this
    cluster matches no described population" into a gate someone can draw.
    Descriptive throughout -- it proposes gates and never changes a scored one.
  contents:
  - learn_convex_gate
  - explain_cluster
  - explain_unmatched_clusters
  - rank_gate_markers
  - fig_gate_strategy

- title: Labels from another tool
  desc: >
    Take a cell labelling this package did not produce, a cyCONDOR clustering for
    instance, learn a gate that selects it, and find out whether that gate holds
    on a donor it was not fitted to. Held-out cells come from the same donors as
    the training cells and overstate transferability; refitting with one donor
    withheld does not.
  contents:
  - read_external_labels
  - join_external_labels
  - explain_external_labels
  - gate_transferability
  - apply_gate_strategy

- title: Gate export
  desc: >
    A learned gate that stays in R cannot be sorted on. These write it out in the
    units the FCS file stores, as ISAC Gating-ML 2.0 and as a plain table of
    vertices.
  contents:
  - write_gating_ml
  - polygons_linear_table
  - polygon_to_linear

- title: Statistics
  desc: >
    Every test below uses per-sample values, so the replicates are donors rather
    than cells.
  contents:
  - abundance_measure
  - stats_group_comparison
  - stats_marker_state
  - stats_subcluster_shifts
  - clr_frequencies
  - compositional_concordance
  - stats_confounding
  - stats_rank_ancova
  - stats_paired_comparison

- title: Batch structure
  desc: >
    Measure the batch effect first, then decide. Correction is opt-in and is
    refused when batch and study group overlap far enough that removing one
    removes the other.
  contents:
  - lisi_score
  - batch_mixing_report
  - marker_batch_drift
  - emd_1d
  - correct_batch

- title: Diagnostics
  desc: >
    Questions about the data and the gating that the analysis itself cannot
    answer.
  contents:
  - stats_threshold_drift
  - write_run_manifest
  - write_miflowcyt
  - write_run_report

- title: Conformance across runs
  desc: >
    The within-run check in thresholds_used.csv compares each sample against its
    peers and catches one bad tube. It cannot catch a cohort that moved as a
    whole, because the peer median moves with it. A baseline written from an
    accepted run is the fixed reference that can.
  contents:
  - write_spec_baseline
  - read_spec_baseline
  - specification_conformance
  - spec_fingerprint

- title: Figures
  contents:
  - starts_with("fig_")
  - theme_cyto

- title: Inputs
  desc: >
    The sample sheet is one row per FCS file, carrying its identity, its
    subject's attributes, its study variables and any externally measured
    counts. It is read into the same structures the three separate loaders
    below produce, by calling the same code, so the two routes cannot diverge.
  contents:
  - read_samplesheet
  - samplesheet_columns
  - load_patient_table
  - load_sample_map
  - load_absolute_counts

- title: Metadata and export
  contents:
  - export_flowjo_fcs

- title: Appearance and session state
  contents:
  - default_colors
  - fcs_colors
  - set_fcs_colors
  - reference_group
  - set_reference_group

articles:
- title: Start here
  navbar: Start here
  desc: >
    What the pipeline is for, where its boundaries are, and every figure a run
    produces on the demonstration cohort.
  contents:
  - cyRAVEN
  - scope
  - figures

- title: Setting up a run
  navbar: Setting up a run
  desc: >
    The two input files, how to declare the populations to be scored, and the
    command-line reference for every flag that changes what a run does.
  contents:
  - inputs
  - gating
  - options

- title: Reading a run
  navbar: Reading a run
  desc: >
    The order the outputs must be read in, what every file contains, and how a
    difference between groups is tested and qualified.
  contents:
  - diagnostics
  - outputs
  - statistics

- title: Going further
  navbar: Going further
  desc: >
    Driving the pipeline from Claude Code, and combining it with cyCONDOR.
  contents:
  - claude-skill
  - with-cycondor

navbar:
  structure:
    left:  [intro, articles, reference, news]
    right: [search, github, lightswitch]
