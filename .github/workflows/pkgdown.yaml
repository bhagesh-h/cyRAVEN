# WHY THERE IS NO `release` TRIGGER.
#
# There was one, and it is half the reason deployments were timing out. Tagging a
# release on a commit that was just pushed to main fires this workflow twice
# within seconds. Both runs push to gh-pages, both spawn GitHub's own
# pages-build-deployment, and Pages deployments serialise: the second sits in
# deployment_in_progress waiting for the first and hits the ten-minute ceiling
# with "Timeout reached, aborting!". A release of a commit already on main
# produces byte-identical documentation, so the second build was never adding
# anything to cancel out.
on:
  push:
    branches: [main]
  workflow_dispatch:

name: pkgdown
permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # cancel-in-progress, not queueing. Two pushes in quick succession used to
    # mean two builds and two deployments racing each other; now the newer push
    # kills the older build, because the older site is about to be replaced
    # anyway and the only thing waiting for it achieves is a timeout.
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
      cancel-in-progress: true
    # A hung build otherwise holds the concurrency group for the six-hour default
    # and every later push queues behind it.
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      # pkgdown renders every vignette through pandoc, and the runner image does
      # not ship one. Two sources rather than one, because a single download from
      # a single host is what failed a release build on a 503. See
      # .github/actions/pandoc.
      - uses: ./.github/actions/pandoc

      - uses: r-lib/actions/setup-r@v2
        with: {use-public-rspm: true}
      - name: Add Bioconductor repository
        run: |
          install.packages("BiocManager")
          cat(sprintf('options(repos = BiocManager::repositories())\n'),
              file = "~/.Rprofile", append = TRUE)
        shell: Rscript {0}
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website
      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      # THE WHOLE SITE AS ONE PDF, built after the site so it can be dropped into
      # docs/ and deployed with it. TinyTeX rather than a full TeX Live: the
      # manual needs about a dozen packages and a full distribution is a
      # multi-gigabyte download on every build.
      #
      # continue-on-error, deliberately. A LaTeX failure must not stop the site
      # from deploying -- the HTML is the primary artefact and the PDF is a
      # convenience. When this step fails the site publishes without the download
      # link resolving, which is visible and fixable; blocking the deployment
      # would take the documentation offline over a missing .sty file.
      # TinyTeX IS INSTALLED FROM R, NOT BY THE ACTION. r-lib/actions/setup-tinytex
      # was here and completed in five seconds, which is not long enough to fetch a
      # hundred megabytes, so it was failing and continue-on-error was hiding both
      # the failure and the reason. Its logs are the only place the reason exists
      # and they need a token to read. tinytex::install_tinytex() does the same job
      # inside the step, so a failure surfaces as an R condition in this log
      # instead of inside somebody else's action.
      #
      # Every stage prints what it found. Three builds in a row produced no PDF and
      # the only evidence available each time was a step duration, so the step now
      # reports the package version, whether the distribution is present, and where
      # tlmgr resolved to.
      #
      # continue-on-error stays. The HTML is the primary artefact and must deploy
      # even when LaTeX will not; the check after the deploy is what turns a
      # missing PDF into a red run.
      - name: Build the PDF manual
        continue-on-error: true
        run: |
          # THE ACTUAL CAUSE OF THREE EMPTY BUILDS, found by running the install
          # in a container rather than reading step durations.
          #
          # install_tinytex() fetches https://yihui.org/tinytex/TinyTeX-1.tar.gz,
          # which redirects to the tinytex-releases "daily" tag. That asset was
          # renamed upstream to TinyTeX-1-tar.gz, a hyphen where the package
          # expects a dot, so the download 404s and the install aborts in seconds.
          # r-lib/actions/setup-tinytex fetches the same URL, which is why it also
          # finished in five seconds.
          #
          # Two changes fix it. CRAN rather than the pinned snapshot, because the
          # snapshot carries tinytex 0.56 and the naming was fixed after it; and a
          # pinned TinyTeX release rather than "daily", so a future rename upstream
          # cannot break this again without someone choosing to move the pin.
          # Verified in a container: the asset downloads, extracts, and
          # is_tinytex() returns TRUE.
          install.packages("tinytex", repos = "https://cloud.r-project.org")
          cat("tinytex package:", as.character(packageVersion("tinytex")), "\n")
          cat("distribution present:", tinytex::is_tinytex(), "\n")
          if (!tinytex::is_tinytex()) tinytex::install_tinytex(version = "2026.08")
          cat("is_tinytex now:", tinytex::is_tinytex(), "\n")
          cat("tlmgr resolves to:", Sys.which("tlmgr"), "\n")
          # latexmk auto-installs a missing style file, so this list is a
          # pre-fetch rather than a requirement. One unresolvable name must not
          # stop the build before it has tried.
          try(tinytex::tlmgr_install(c("pdflscape", "titlesec", "fancyhdr",
                                       "fvextra", "xurl", "ragged2e", "booktabs",
                                       "framed", "environ", "trimspaces",
                                       "koma-script")))
          source("pkgdown/manual/build-manual.R")
        shell: Rscript {0}
      # v4.8.0 is the first release on the Node 24 runtime; 4.5.0 ran on Node 20,
      # which the runners now force onto 24 and warn about.
      #
      # single-commit REPLACES gh-pages with one commit each time, instead of
      # adding to its history. The branch was previously deployed with
      # clean: false, so every build layered its output on top of every earlier
      # build: files pkgdown had stopped generating were never removed, and the
      # branch the Pages builder has to check out grew with each release. A
      # pkgdown site is a few hundred small files, so that accumulation is what
      # the deployment step was spending its ten minutes on.
      #
      # Nothing is lost by discarding that history. gh-pages is build output; the
      # source it came from is in main, and the commit it was built from is
      # recorded in the deploy message.
      - uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          branch: gh-pages
          folder: docs
          single-commit: true

      # AFTER the deploy, and it FAILS the job. Ordering is the whole point. A
      # check before the deploy that fails would stop the site publishing over a
      # missing PDF, so the earlier version only warned, and a warning shows as
      # success in the run list and the API. Two silent 404s reached the site that
      # way. Placed here the site is already published when this runs, so failing
      # costs nothing and the run goes red, which is the only signal nobody
      # scrolls past.
      - name: Check the PDF manual was written
        if: always()
        run: |
          if [ -f docs/cyRAVEN-manual.pdf ]; then
            ls -lh docs/cyRAVEN-manual.pdf
            echo "PDF manual published" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=PDF manual missing::The site deployed without cyRAVEN-manual.pdf, so the download link 404s. See the Build the PDF manual step for the cause."
            exit 1
          fi
