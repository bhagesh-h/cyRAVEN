# WHY THERE IS NO `release` TRIGGER.
#
# There was one, and it is half the reason deployments were timing out. Tagging a
# release on a commit that was just pushed to main fires this workflow twice
# within seconds. Both runs push to gh-pages, both spawn GitHub's own
# pages-build-deployment, and Pages deployments serialise: the second sits in
# deployment_in_progress waiting for the first and hits the ten-minute ceiling
# with "Timeout reached, aborting!". A release of a commit already on main
# produces byte-identical documentation, so the second build was never adding
# anything to cancel out.
on:
  push:
    branches: [main]
  workflow_dispatch:

name: pkgdown
permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # cancel-in-progress, not queueing. Two pushes in quick succession used to
    # mean two builds and two deployments racing each other; now the newer push
    # kills the older build, because the older site is about to be replaced
    # anyway and the only thing waiting for it achieves is a timeout.
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
      cancel-in-progress: true
    # A hung build otherwise holds the concurrency group for the six-hour default
    # and every later push queues behind it.
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      # pkgdown renders every vignette through pandoc, and the runner image does
      # not ship one. Two sources rather than one, because a single download from
      # a single host is what failed a release build on a 503. See
      # .github/actions/pandoc.
      - uses: ./.github/actions/pandoc

      - uses: r-lib/actions/setup-r@v2
        with: {use-public-rspm: true}
      - name: Add Bioconductor repository
        run: |
          install.packages("BiocManager")
          cat(sprintf('options(repos = BiocManager::repositories())\n'),
              file = "~/.Rprofile", append = TRUE)
        shell: Rscript {0}
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website
      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      # THE WHOLE SITE AS ONE PDF, built after the site so it can be dropped into
      # docs/ and deployed with it. TinyTeX rather than a full TeX Live: the manual
      # needs about a dozen packages and a full distribution is a multi-gigabyte
      # download on every build.
      #
      # continue-on-error stays. The HTML is the primary artefact and must deploy
      # even when LaTeX will not; the check after the deploy is what turns a missing
      # PDF into a red run.
      # THE LOG IS PUBLISHED WITH THE SITE. Three builds produced no PDF and the
      # only evidence available was a step duration: a failing step's log needs a
      # token to read, and continue-on-error reports it as success either way.
      # Teeing into docs/ turns an opaque CI failure into a URL,
      # /manual-build.log, readable by anyone who needs to know why the download
      # link is missing. It is overwritten every build and costs a few kilobytes.
      #
      # The R lives in pkgdown/manual/ci-build.R rather than inline: an R heredoc
      # inside YAML inside a shell is where two earlier attempts went wrong.
      - name: Build the PDF manual
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p docs
          Rscript pkgdown/manual/ci-build.R 2>&1 | tee docs/manual-build.log
      # v4.8.0 is the first release on the Node 24 runtime; 4.5.0 ran on Node 20,
      # which the runners now force onto 24 and warn about.
      #
      # single-commit REPLACES gh-pages with one commit each time, instead of
      # adding to its history. The branch was previously deployed with
      # clean: false, so every build layered its output on top of every earlier
      # build: files pkgdown had stopped generating were never removed, and the
      # branch the Pages builder has to check out grew with each release. A
      # pkgdown site is a few hundred small files, so that accumulation is what
      # the deployment step was spending its ten minutes on.
      #
      # Nothing is lost by discarding that history. gh-pages is build output; the
      # source it came from is in main, and the commit it was built from is
      # recorded in the deploy message.
      - uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          branch: gh-pages
          folder: docs
          single-commit: true

      # AFTER the deploy, and it FAILS the job. Ordering is the whole point. A
      # check before the deploy that fails would stop the site publishing over a
      # missing PDF, so the earlier version only warned, and a warning shows as
      # success in the run list and the API. Two silent 404s reached the site that
      # way. Placed here the site is already published when this runs, so failing
      # costs nothing and the run goes red, which is the only signal nobody
      # scrolls past.
      - name: Check the PDF manual was written
        if: always()
        run: |
          if [ -f docs/cyRAVEN-manual.pdf ]; then
            ls -lh docs/cyRAVEN-manual.pdf
            echo "PDF manual published" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=PDF manual missing::The site deployed without cyRAVEN-manual.pdf, so the download link 404s. See the Build the PDF manual step for the cause."
            exit 1
          fi
