# WHY THERE IS NO `release` TRIGGER.
#
# There was one, and it is half the reason deployments were timing out. Tagging a
# release on a commit that was just pushed to main fires this workflow twice
# within seconds. Both runs push to gh-pages, both spawn GitHub's own
# pages-build-deployment, and Pages deployments serialise: the second sits in
# deployment_in_progress waiting for the first and hits the ten-minute ceiling
# with "Timeout reached, aborting!". A release of a commit already on main
# produces byte-identical documentation, so the second build was never adding
# anything to cancel out.
on:
  push:
    branches: [main]
  workflow_dispatch:

name: pkgdown
permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # cancel-in-progress, not queueing. Two pushes in quick succession used to
    # mean two builds and two deployments racing each other; now the newer push
    # kills the older build, because the older site is about to be replaced
    # anyway and the only thing waiting for it achieves is a timeout.
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
      cancel-in-progress: true
    # A hung build otherwise holds the concurrency group for the six-hour default
    # and every later push queues behind it.
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      # The runner images already ship pandoc 3.x. setup-pandoc downloads its own
      # from GitHub releases, which has 503'd and failed a release build for a
      # reason that has nothing to do with this package. Try it, but do not let
      # it be fatal: the verify step below fails loudly if NEITHER source left a
      # usable pandoc, so a real absence is still caught.
      - uses: r-lib/actions/setup-pandoc@v2
        continue-on-error: true

      - name: Verify pandoc is available
        run: |
          pandoc --version || {
            echo "::error::no pandoc from setup-pandoc or the runner image"; exit 1; }

      - uses: r-lib/actions/setup-r@v2
        with: {use-public-rspm: true}
      - name: Add Bioconductor repository
        run: |
          install.packages("BiocManager")
          cat(sprintf('options(repos = BiocManager::repositories())\n'),
              file = "~/.Rprofile", append = TRUE)
        shell: Rscript {0}
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website
      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}
      # v4.8.0 is the first release on the Node 24 runtime; 4.5.0 ran on Node 20,
      # which the runners now force onto 24 and warn about.
      #
      # single-commit REPLACES gh-pages with one commit each time, instead of
      # adding to its history. The branch was previously deployed with
      # clean: false, so every build layered its output on top of every earlier
      # build: files pkgdown had stopped generating were never removed, and the
      # branch the Pages builder has to check out grew with each release. A
      # pkgdown site is a few hundred small files, so that accumulation is what
      # the deployment step was spending its ten minutes on.
      #
      # Nothing is lost by discarding that history. gh-pages is build output; the
      # source it came from is in main, and the commit it was built from is
      # recorded in the deploy message.
      - uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          branch: gh-pages
          folder: docs
          single-commit: true
